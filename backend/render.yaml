services:
  - type: web
    name: mathquest-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: OPENAI_API_KEY   # Option A: OpenAI
        sync: false
      - key: GROQ_API_KEY     # Option B: Groq (free)
        sync: false
      - key: OPENROUTER_API_KEY  # Option C: OpenRouter (free tier available)
        sync: false
      - key: OPENROUTER_MODEL    # e.g. meta-llama/llama-3.1-8b-instruct:free
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
